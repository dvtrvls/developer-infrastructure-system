<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevInfra Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans+JP:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <div class="dashboard">
        <!--Top Bar-->
        <div class="topbar">
            <div class="topbar-left">
                <div class="logo">
                    <span>D</span>
                </div>    
                <div>
                    <div class="app-title">DevInfra Monitor</div>
                    <div class="app-subtitle">developer infrastructure system</div>
                </div>
            </div>
           <div class="topbar-right" style="display:flex;align-items:center;gap:12px;">
                <div class="status-badge">
                    <div class="status-dot"></div>
                    live
                </div>
                <a href="/logout" class="logout-btn">logout</a>
            </div>      
        </div>

        <!--Metrics-->
        <div class="metric-grid">
            <div class="metric-card">

                <div class="metric-label">CPU</div>
                <div class="metric-value skeleton" id="cpu-value">%</div>
                <div class="metric-bar">
                    <div class="metric-bar-fill" id="cpu-bar"></div>
                </div>
                <div class="metric-status" id="cpu-status">loading ...</div>
            </div>

            <div class="metric-card">
                <div class="metric-label">Memory</div>
                <div class="metric-value skeleton" id="memory-value">%</div>
                <div class="metric-bar">
                    <div class="metric-bar-fill" id="memory-bar"></div>
                </div>
                <div class="metric-status" id="memory-status">loading ...</div>
            </div>

            <div class="metric-card">
                <div class="metric-label">Disk</div>
                 <div class="metric-value skeleton" id="disk-value">%</div>
                <div class="metric-bar">
                    <div class="metric-bar-fill" id="disk-bar"></div>
                </div>
                <div class="metric-status" id="disk-status">loading ...</div>
            </div>
            <div class="metric-card" id="metric-card-alert">
                <div class="metric-label">Alert Today</div>
                <div class="metric-value" id="alert-count"></div>
                 <div class="metric-status" id="alert-critical">loading ...</div>
            </div>

        </div>


        <!--Panels-->

        <div class="panel-grid">

            <div class="panel">

                <div class="panel-header">
                    <div class="panel-title">Recent Alerts</div>
                    <div class="panel-count" id="alert-total">0</div>
                </div>

                <div class="alert-list" id="alert-list">
                    <div class="loading-text">Loading Alerts ...</div>

                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">Alert Breakdown</div>
                </div>
                
                <div class="breakdown-list">
                    <div class="breakdown-row">
                        <div class="breakdown-label">
                            <div class="breakdown-dot dot-critical"></div>
                            Critical
                        </div>
                        <div class="breakdown-value critical-text" id="count-critical">0</div>
                    </div>

                     <div class="breakdown-row">
                        <div class="breakdown-label">
                            <div class="breakdown-dot dot-warning"></div>
                            Warning
                        </div>
                        <div class="breakdown-value warning-text" id="count-warning">0</div>
                    </div>

                     <div class="breakdown-row">
                        <div class="breakdown-label">
                            <div class="breakdown-dot dot-info"></div>
                            Info
                        </div>
                        <div class="breakdown-value info-text" id="count-info">0</div>
                    </div>

                    <div class="breakdown-row">
                        <div class="breakdown-label">
                            <div class="breakdown-dot dot-error"></div>
                            Error
                        </div>
                        <div class="breakdown-value error-text" id="count-error">0</div>
                    </div>

                </div>
            </div>
        
        </div>

        <!--Log Feed-->

        <div class="log-panel">
            <div class="panel-header">
                <div class="panel-title">Live Log Feed</div>
                <div class="log-controls">
                    <select id="log-filter" class="log-select">
                        <option value="all">all</option>
                        <option value="CRITICAL">critical</option>
                        <option value="WARNING">warning</option>
                        <option value="ERROR">error</option>
                        <option value="INFO">info</option>
                    </select>
                    <div class="clear-btn" onclick="clearLogs()">clear</div>
                </div>
            </div>

            <div class="log-feed" id="log-feed">
                <div class="loading-text">waiting for logs</div>
            </div>
        </div>
    </div>


    <script src="static/js/app.js"></script>
</body>
</html>
